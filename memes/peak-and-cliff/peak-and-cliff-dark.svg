<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1148" viewBox="0 0 2000 1148" role="img" aria-labelledby="title desc">
<title id="title">A chart, our version of Thomas Jiralerspong's Karpathy Peak chart, redrawn for memory. Across, the memory grows; up, the useful work. A thinner line, tagged in the window, is the outline of a shaded mountain: a memory kept in the context window climbs to a sharp summit named KARPATHY PEAK, then drops straight down a sheer cliff named CONTEXT CLIFF to almost nothing, and stays there as the memory keeps growing. A heavier line, tagged on disk, starts with it, passes under the peak in front of the mountain, and keeps climbing to the top right, past the height of the peak, with no cliff. A small credit reads: after Thomas Jiralerspong's Karpathy Peak.</title>
<desc id="desc">A chart, our version of Thomas Jiralerspong's Karpathy Peak chart, redrawn for memory. Across, the memory grows; up, the useful work. A thinner line, tagged in the window, is the outline of a shaded mountain: a memory kept in the context window climbs to a sharp summit named KARPATHY PEAK, then drops straight down a sheer cliff named CONTEXT CLIFF to almost nothing, and stays there as the memory keeps growing. A heavier line, tagged on disk, starts with it, passes under the peak in front of the mountain, and keeps climbing to the top right, past the height of the peak, with no cliff. A small credit reads: after Thomas Jiralerspong's Karpathy Peak.</desc>
